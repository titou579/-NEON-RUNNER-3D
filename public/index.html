<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Runner 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0018;
    font-family:'Segoe UI', system-ui, sans-serif; color:#fff; }
  canvas { display:block; }

  #hud { position:fixed; top:0; left:0; right:0; padding:16px 24px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none; font-weight:800; font-size:clamp(16px,3vw,22px);
    letter-spacing:2px; text-shadow:0 0 12px #0ff; z-index:10; }
  #lives { color:#ff44dd; text-shadow:0 0 12px #f0f; }

  #overlay { position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at center, rgba(30,0,60,0.75), rgba(0,0,10,0.92));
    text-align:center; padding:24px; transition:opacity .3s; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 { font-size:clamp(34px,9vw,80px); font-weight:900; letter-spacing:3px;
    background:linear-gradient(90deg,#00ffff,#ff00ff,#ffff00);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,0,255,0.6)); margin-bottom:16px; }
  #overlayText { font-size:clamp(14px,2.4vw,18px); max-width:600px;
    line-height:1.7; opacity:.9; margin-bottom:10px; }
  #overlayText b { color:#0ff; text-shadow:0 0 10px #0ff; }
  #startBtn { margin-top:28px; padding:16px 48px; font-size:20px; font-weight:800;
    letter-spacing:3px; border:none; border-radius:50px; cursor:pointer;
    background:linear-gradient(90deg,#00ffff,#ff00ff); color:#000;
    box-shadow:0 0 40px rgba(255,0,255,.6), 0 0 20px rgba(0,255,255,.5);
    transition:transform .15s, box-shadow .15s; font-family:inherit; }
  #startBtn:hover { transform:scale(1.08); box-shadow:0 0 60px rgba(255,0,255,.9); }
  #startBtn:active { transform:scale(.97); }

  #flash { position:fixed; inset:0; background:#ff0033; opacity:0;
    pointer-events:none; z-index:15; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>SCORE: <span id="score">0</span></div>
  <div id="lives">❤❤❤</div>
</div>
<div id="flash"></div>
<div id="overlay">
  <h1>NEON RUNNER 3D</h1>
  <p id="overlayText">
    Esquive les <b>blocs rouges</b>, ramasse les <b>cristaux cyan</b>.<br>
    ← → ou A / D au clavier • Tape à gauche/droite sur mobile.
  </p>
  <button id="startBtn">JOUER</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ---------- RENDERER / SCENE ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08001a, 0.009);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 5.5, 9);
camera.lookAt(0, 1.2, -15);

/* ---------- SKY GRADIENT ---------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(200, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top:    { value: new THREE.Color(0x2a0055) },
      bottom: { value: new THREE.Color(0x000005) },
    },
    vertexShader: `varying vec3 vP; void main(){ vP = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
      void main(){ float h = normalize(vP).y*0.5+0.5;
      gl_FragColor = vec4(mix(bottom, top, h), 1.0); }`
  })
);
scene.add(sky);

/* ---------- LIGHTS ---------- */
scene.add(new THREE.AmbientLight(0x8866ff, 1.3));
const lightPink = new THREE.PointLight(0xff00ff, 4, 120);
lightPink.position.set(10, 14, 6);
scene.add(lightPink);
const lightCyan = new THREE.PointLight(0x00ffff, 4, 120);
lightCyan.position.set(-10, 14, -6);
scene.add(lightCyan);

/* ---------- SOL NÉON ---------- */
function makeGridTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0018';
  ctx.fillRect(0, 0, s, s);
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ff00ff';
  ctx.shadowBlur = 14;
  for (let i = 0; i <= 8; i++) {
    const p = i * s / 8;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(s, p); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 40);
  tex.anisotropy = 4;
  return tex;
}
const groundTex = makeGridTexture();
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 400),
  new THREE.MeshBasicMaterial({ map: groundTex })
);
ground.rotation.x = -Math.PI / 2;
ground.position.z = -180;
scene.add(ground);

// Rails néon
const railMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
const railGeo = new THREE.BoxGeometry(0.12, 0.12, 400);
const railL = new THREE.Mesh(railGeo, railMat);
railL.position.set(-5.6, 0.1, -180);
scene.add(railL);
const railR = railL.clone(); railR.position.x = 5.6; scene.add(railR);

/* ---------- ÉTOILES ---------- */
{
  const N = 400;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i*3]   = (Math.random() - 0.5) * 180;
    pos[i*3+1] = Math.random() * 50 + 8;
    pos[i*3+2] = -Math.random() * 150 - 10;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.45, transparent: true, opacity: 0.85,
    sizeAttenuation: true
  })));
}

/* ---------- JOUEUR ---------- */
const player = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.7, 2),
  new THREE.MeshStandardMaterial({
    color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 1.6,
    roughness: 0.15, metalness: 0.7
  })
);
player.position.set(0, 0.9, 0);
scene.add(player);
const playerLight = new THREE.PointLight(0x00ffff, 2, 14);
player.add(playerLight);

/* ---------- ÉTAT ---------- */
const LANES = [-3, 0, 3];
const state = {
  running: false, over: false,
  score: 0, speed: 22, time: 0,
  currentLane: 1, targetX: 0,
  lives: 3, invuln: 0,
  spawnTimer: 0.8, shake: 0,
  obstacles: [], crystals: [], particles: []
};

/* ---------- AUDIO ---------- */
let audioCtx = null;
function beep(freq, dur, type = 'sine', vol = 0.08) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

/* ---------- UI ---------- */
const scoreEl   = document.getElementById('score');
const livesEl   = document.getElementById('lives');
const overlay   = document.getElementById('overlay');
const overlayTx = document.getElementById('overlayText');
const startBtn  = document.getElementById('startBtn');
const flashEl   = document.getElementById('flash');

function updateLives() {
  livesEl.textContent = '❤'.repeat(state.lives) + '♡'.repeat(Math.max(0, 3 - state.lives));
}
function flashScreen() {
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.55';
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity 0.45s';
    flashEl.style.opacity = '0';
  });
}

/* ---------- SPAWN ---------- */
function spawnWave() {
  const lanes = [0, 1, 2];
  for (let i = lanes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
  }
  const nbObs = Math.random() < 0.6 ? 1 : 2;
  const obsLanes  = lanes.slice(0, nbObs);
  const freeLanes = lanes.slice(nbObs);

  for (const l of obsLanes) {
    const o = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 1.7, 1.7),
      new THREE.MeshStandardMaterial({
        color: 0xff2255, emissive: 0xff0033,
        emissiveIntensity: 1.3, roughness: 0.3, metalness: 0.6
      })
    );
    o.position.set(LANES[l], 0.85, -100);
    scene.add(o);
    state.obstacles.push(o);
  }
  for (const l of freeLanes) {
    if (Math.random() < 0.78) {
      const c = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.55, 0),
        new THREE.MeshStandardMaterial({
          color: 0x00ffff, emissive: 0x00ffff,
          emissiveIntensity: 2.2, roughness: 0.1, metalness: 0.9
        })
      );
      c.position.set(LANES[l], 1.2, -100);
      scene.add(c);
      state.crystals.push(c);
    }
  }
}

/* ---------- PARTICULES ---------- */
const pGeo = new THREE.SphereGeometry(0.1, 6, 6);
function burst(pos, color, count) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 1
    }));
    m.position.copy(pos);
    scene.add(m);
    state.particles.push({
      mesh: m,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 9,
        Math.random() * 6 + 2,
        (Math.random() - 0.5) * 9
      ),
      life: 0.75, maxLife: 0.75
    });
  }
}

/* ---------- COLLISIONS ---------- */
function hitObstacle(o) {
  state.lives--;
  state.invuln = 1.6;
  state.shake = 1.6;
  updateLives();
  flashScreen();
  burst(o.position, 0xff2255, 22);
  beep(140, 0.25, 'sawtooth', 0.12);
  if (state.lives <= 0) gameOver();
}
function collectCrystal(c) {
  state.score += 50;
  burst(c.position, 0x00ffff, 14);
  beep(880, 0.12, 'sine', 0.07);
  setTimeout(() => beep(1320, 0.1, 'sine', 0.05), 60);
}

/* ---------- BOUCLE ---------- */
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
}

function update(dt) {
  const active = state.running && !state.over;

  if (active) {
    state.time += dt;
    state.speed = Math.min(60, 22 + state.time * 0.7);
    state.score += state.speed * dt * 0.5;
    scoreEl.textContent = Math.floor(state.score);
  }

  // Défilement du sol (vers la caméra)
  groundTex.offset.y += dt * (active ? state.speed : 4) / 10;

  // Déplacement joueur (lerp doux)
  state.targetX = LANES[state.currentLane];
  player.position.x += (state.targetX - player.position.x) * Math.min(1, dt * 18);
  player.rotation.x += dt * 1.5;
  player.rotation.y += dt * 2.5;

  // Clignotement invulnérabilité
  if (state.invuln > 0) {
    state.invuln -= dt;
    player.visible = Math.floor(state.invuln * 14) % 2 === 0;
  } else {
    player.visible = true;
  }

  // Obstacles
  for (let i = state.obstacles.length - 1; i >= 0; i--) {
    const o = state.obstacles[i];
    const prevZ = o.position.z;
    if (active) o.position.z += state.speed * dt;
    o.rotation.x += dt * 1.2;
    o.rotation.y += dt * 1.6;
    if (o.position.z > 12) {
      scene.remove(o); state.obstacles.splice(i, 1); continue;
    }
    if (active && state.invuln <= 0) {
      const zMin = Math.min(prevZ, o.position.z);
      const zMax = Math.max(prevZ, o.position.z);
      if (zMax > -0.9 && zMin < 0.9 &&
          Math.abs(o.position.x - player.position.x) < 1.0) {
        hitObstacle(o);
        scene.remove(o); state.obstacles.splice(i, 1);
      }
    }
  }

  // Cristaux
  for (let i = state.crystals.length - 1; i >= 0; i--) {
    const c = state.crystals[i];
    const prevZ = c.position.z;
    if (active) c.position.z += state.speed * dt;
    c.rotation.y += dt * 3.2;
    c.rotation.x += dt * 1.7;
    c.position.y = 1.2 + Math.sin(performance.now() * 0.004 + i) * 0.15;
    if (c.position.z > 12) {
      scene.remove(c); state.crystals.splice(i, 1); continue;
    }
    if (active) {
      const zMin = Math.min(prevZ, c.position.z);
      const zMax = Math.max(prevZ, c.position.z);
      if (zMax > -1.2 && zMin < 1.2 &&
          Math.abs(c.position.x - player.position.x) < 1.2) {
        collectCrystal(c);
        scene.remove(c); state.crystals.splice(i, 1);
      }
    }
  }

  // Particules
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.mesh.position.addScaledVector(p.vel, dt);
    p.vel.y -= 16 * dt;
    p.life -= dt;
    const k = Math.max(0, p.life / p.maxLife);
    p.mesh.material.opacity = k;
    p.mesh.scale.setScalar(k);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.material.dispose();
      state.particles.splice(i, 1);
    }
  }

  // Spawn
  if (active) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnWave();
      state.spawnTimer = Math.max(0.38, 0.95 - state.time * 0.008);
    }
  }

  // Screen shake
  if (state.shake > 0) {
    state.shake -= dt * 3;
    camera.position.x = (Math.random() - 0.5) * state.shake * 0.6;
    camera.position.y = 5.5 + (Math.random() - 0.5) * state.shake * 0.6;
  } else {
    camera.position.x += (0 - camera.position.x) * 0.15;
    camera.position.y += (5.5 - camera.position.y) * 0.15;
  }
  camera.lookAt(0, 1.2, -15);

  // Lumières qui voyagent
  lightPink.position.z = 6 - (state.time * 4) % 50;
  lightCyan.position.z = -6 - (state.time * 4) % 50;
}

/* ---------- CONTRÔLES ---------- */
function moveLane(dir) {
  if (!state.running || state.over) return;
  const next = Math.max(0, Math.min(2, state.currentLane + dir));
  if (next !== state.currentLane) {
    state.currentLane = next;
    beep(520, 0.05, 'triangle', 0.03);
  }
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A' || e.key === 'q' || e.key === 'Q') moveLane(-1);
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
});
canvas.addEventListener('touchstart', e => {
  if (!state.running || state.over) return;
  const x = e.touches[0].clientX;
  moveLane(x < innerWidth / 2 ? -1 : 1);
}, { passive: true });

/* ---------- RESET / GAME OVER ---------- */
function resetGame() {
  for (const o of state.obstacles) scene.remove(o);
  for (const c of state.crystals)  scene.remove(c);
  for (const p of state.particles) scene.remove(p.mesh);
  state.obstacles = []; state.crystals = []; state.particles = [];

  state.score = 0; state.time = 0; state.speed = 22;
  state.lives = 3; state.invuln = 0;
  state.spawnTimer = 0.8; state.shake = 0;
  state.currentLane = 1; state.over = false;

  player.position.set(0, 0.9, 0);
  player.visible = true;
  camera.position.set(0, 5.5, 9);
  scoreEl.textContent = '0';
  updateLives();
}

function startGame() {
  resetGame();
  state.running = true;
  overlay.classList.add('hidden');
  last = performance.now();
  beep(660, 0.15, 'sine', 0.08);
  setTimeout(() => beep(990, 0.2, 'sine', 0.08), 130);
}

function gameOver() {
  state.over = true;
  state.running = false;
  const finalScore = Math.floor(state.score);
  const best = Math.max(Number(localStorage.getItem('neonRunnerBest') || 0), finalScore);
  localStorage.setItem('neonRunnerBest', best);

  document.querySelector('#overlay h1').textContent = 'GAME OVER';
  overlayTx.innerHTML = `Score : <b>${finalScore}</b><br>Meilleur score : <b>${best}</b>`;
  startBtn.textContent = 'REJOUER';
  overlay.classList.remove('hidden');
  beep(220, 0.3, 'sawtooth', 0.1);
  setTimeout(() => beep(160, 0.4, 'sawtooth', 0.1), 180);
}

startBtn.addEventListener('click', startGame);

/* ---------- RESIZE ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- GO ---------- */
updateLives();
animate(performance.now());
</script>
</body>
</html>
